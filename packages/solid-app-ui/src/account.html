<header class="swb-suite-header ds-panels-heading"
  data-simply-field="muzeSolidUiHeader" data-simply-transform="attributes"
  data-simply-attributes="data-muze-solid-ui-content-view">
  <span
    class="muze-solid-ui-embedded"
    hidden
    data-simply-field="muzeSolidUiEmbedded"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  ></span>
  <h1
    class="ds-panels-title swb-header-title"
    tabindex="-1"
    data-simply-field="muzeSolidUiTitle"
    data-simply-transform="escape_html"
  >
    {{title}}
  </h1>
  <nav class="muze-solid-design-toolbar muze-solid-ui-app-toolbar"
    aria-label="Application actions"
    data-simply-field="muzeSolidUiAppToolbar"
    data-simply-transform="attributes" data-simply-attributes="hidden">
    <div style="display:contents" data-simply-list="muzeSolidUiAppTools">
      <template><button type="button" class="muze-solid-design-tool"
        data-simply-command="muzeSolidUiAppAction" data-simply-value=":value.command"
        data-simply-field="attributes" data-simply-transform="attributes"
        data-simply-attributes="disabled title aria-label data-muze-solid-action">
        <svg class="ds-icon ds-icon-feather" aria-hidden="true"><use
          data-simply-field="icon" data-simply-transform="attributes"
          data-simply-attributes="href"></use></svg>
        <span data-simply-field="label" data-simply-transform="escape_html"></span>
      </button></template>
    </div>
  </nav>
  <div
    class="swb-account ds-dropdown muze-solid-design-dropdown"
    data-simply-shortcuts="muzeSolidDesignDropdown"
    hidden
    data-simply-field="muzeSolidUiMenuVisibility"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    <button
      type="button"
      data-simply-command="muzeSolidUiOwnProfile"
      class="swb-account-name"
      title="View and edit your profile"
      aria-haspopup="dialog"
      data-simply-field="muzeSolidUiProfileButton"
      data-simply-transform="attributes"
      data-simply-attributes="aria-label"
    >
      <span
        data-simply-field="accountName"
        data-simply-transform="escape_html"
      ></span>
    </button>
    <button
      type="button"
      class="ds-button ds-button-naked muze-solid-ui-account-status"
      data-simply-command="connectDialog"
      data-simply-field="muzeSolidUiStatusButton"
      data-simply-transform="attributes"
      data-simply-attributes="aria-label title"
      aria-haspopup="dialog"
    >
      <svg class="ds-icon ds-icon-feather" aria-hidden="true">
        <use
          data-simply-field="muzeSolidUiStatusIcon"
          data-simply-transform="attributes"
          data-simply-attributes="href"
        ></use>
      </svg>
    </button>
    <button
      type="button"
      class="ds-button ds-button-naked swb-account-button"
      popovertarget="muze-solid-ui-account-menu"
      aria-label="Account and preferences"
      title="Account and preferences"
    >
      <svg class="ds-icon ds-icon-feather" aria-hidden="true">
        <use href="../assets/feather-icons.svg#user"></use>
      </svg>
    </button>
    <nav
      id="muze-solid-ui-account-menu"
      class="ds-dropdown-nav ds-dropdown-right swb-account-menu swb-dropdown-menu"
      popover="auto"
      aria-label="Account"
    >
      <ul class="ds-dropdown-list swb-dropdown-list">
        <li class="ds-dropdown-item swb-dropdown-item">
          <button
            type="button"
            class="ds-button ds-button-naked ds-dropdown-link swb-account-link swb-dropdown-link"
            data-simply-command="connectDialog"
          >
            WebID / connection
          </button>
        </li>
        <li class="ds-dropdown-item swb-dropdown-item">
          <button
            type="button"
            class="ds-button ds-button-naked ds-dropdown-link swb-account-link swb-dropdown-link"
            data-simply-command="preferences"
          >
            Preferences
          </button>
        </li>
        {{appMenu}}
      </ul>
    </nav>
  </div>
  <button
    type="button"
    class="ds-button muze-solid-ui-task-connect"
    data-simply-command="connectDialog"
    hidden
    data-simply-field="muzeSolidUiTaskConnectVisibility"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    WebID / connection
  </button>
  <p
    class="swb-suite-status"
    role="status"
    data-simply-field="message"
    data-simply-transform="escape_html"
  ></p>
  <dialog
    class="ds-dialog muze-solid-design-dialog muze-solid-ui-recovery-dialog"
    data-simply-behavior="muzeSolidUiRecoveryDialog"
    aria-labelledby="muze-solid-ui-recovery-title"
    aria-describedby="muze-solid-ui-recovery-description"
  >
    <header class="muze-solid-design-dialog-header">
      <h2 class="swb-dialog-title" id="muze-solid-ui-recovery-title">
        Sign in again
      </h2>
      <button
        type="button"
        class="ds-button muze-solid-design-dialog-close"
        data-simply-command="muzeSolidUiCancelSignIn"
        aria-label="Close sign-in dialog"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#x"></use>
        </svg>
      </button>
    </header>
    <div class="muze-solid-design-dialog-content swb-recovery-content">
      <p id="muze-solid-ui-recovery-description">
        Your Solid session needs a new sign-in. Your edits are retained. Sign in
        to continue the pending request, or cancel and try later.
      </p>
      <p
        role="status"
        data-simply-field="muzeSolidUiRecoveryError"
        data-simply-transform="escape_html"
      ></p>
    </div>
    <footer class="muze-solid-design-dialog-footer">
      <button
        type="button"
        class="ds-button ds-button-primary"
        data-simply-command="muzeSolidUiSignInAgain"
        data-simply-field="muzeSolidUiRecoveryButton"
        data-simply-transform="attributes"
        data-simply-attributes="disabled"
      >
        Sign in again
      </button>
      <button
        type="button"
        class="ds-button"
        data-simply-command="muzeSolidUiCancelSignIn"
      >
        Cancel
      </button>
    </footer>
  </dialog>
</header>
