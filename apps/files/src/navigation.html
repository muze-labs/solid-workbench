<div data-simply-field="editing" data-simply-transform="attributes"
  data-simply-attributes="hidden">
  <p
    class="swb-muted"
    data-simply-field="editing"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    Deleted files are hidden; their contents remain in your storage.
  </p>
  <table class="swb-file-list">
    <thead>
      <tr>
        <th class="swb-file-heading swb-file-cell">Name</th>
        <th class="swb-file-heading swb-file-cell">Type</th>
        <th class="swb-file-heading swb-file-cell">Actions</th>
      </tr>
    </thead>
    <tbody data-simply-list="entries">
      <template
        ><tr>
          <td class="swb-file-cell">
            <button
              class="ds-button swb-file-action"
              data-simply-command="open"
              data-simply-value=":value.url"
            >
              <span
                data-simply-field="name"
                data-simply-transform="escape_html"
              ></span>
            </button>
          </td>
          <td
            class="swb-file-cell"
            data-simply-field="type"
            data-simply-transform="escape_html"
          ></td>
          <td class="swb-file-cell">
            <button
              class="ds-button swb-file-action"
              data-simply-command="selectResource"
              data-simply-value=":value.url"
              hidden
              data-simply-field="pick"
              data-simply-transform="attributes"
              data-simply-attributes="hidden"
            >
              Select
            </button>
            <button type="button" class="ds-button swb-file-action swb-share-button"
              data-simply-command="swb_shareResource" data-simply-value=":value.url"
              data-simply-field="edit" data-simply-transform="attributes"
              data-simply-attributes="hidden">Share…</button>
            <button
              class="ds-button swb-file-action"
              data-simply-command="remove"
              data-simply-value=":value.url"
              data-simply-field="edit"
              data-simply-transform="attributes"
              data-simply-attributes="hidden"
            >
              Delete
            </button>
          </td>
        </tr></template
      >
    </tbody>
  </table>
  <p
    class="swb-empty"
    data-simply-field="empty"
    data-simply-transform="escape_html"
  ></p>
</div>
