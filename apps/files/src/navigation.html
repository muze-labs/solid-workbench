<div style="display: contents">
  <ul
    class="swb-file-list"
    aria-label="Files in this folder"
    data-simply-list="entries"
  >
    <template
      ><li class="muze-solid-files-entry">
        <button
          type="button"
          class="muze-solid-design-tool swb-file-name"
          data-simply-command="open"
          data-simply-value=":value.url"
          data-simply-field="selected"
          data-simply-transform="attributes"
          data-simply-attributes="aria-current title"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use
              data-simply-field="icon"
              data-simply-transform="attributes"
              data-simply-attributes="href"
            ></use>
          </svg>
          <span
            class="muze-solid-files-entry-name"
            data-simply-field="name"
            data-simply-transform="escape_html"
          ></span>
        </button>
        <button
          type="button"
          class="muze-solid-design-tool muze-solid-files-entry-more"
          data-simply-field="menuButton"
          data-simply-transform="attributes"
          data-simply-attributes="popovertarget aria-label"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use href="../assets/feather-icons.svg#more-horizontal"></use>
          </svg>
        </button>
        <div
          class="muze-solid-files-entry-menu"
          popover
          data-simply-field="menu"
          data-simply-transform="attributes"
          data-simply-attributes="id"
        >
          <p
            class="muze-solid-files-caption"
            data-simply-field="name"
            data-simply-transform="escape_html"
          ></p>
          <button
            type="button"
            class="muze-solid-design-tool muze-solid-files-folder-option swb-share-button"
            data-simply-command="swb_shareResource"
            data-simply-value=":value.url"
          >
            <svg class="ds-icon ds-icon-feather" aria-hidden="true">
              <use href="../assets/feather-icons.svg#share-2"></use></svg
            >Share…
          </button>
          <button
            type="button"
            class="muze-solid-design-tool muze-solid-files-folder-option"
            data-simply-command="remove"
            data-simply-value=":value.url"
          >
            <svg class="ds-icon ds-icon-feather" aria-hidden="true">
              <use href="../assets/feather-icons.svg#trash-2"></use></svg
            >Delete
          </button>
        </div>
      </li></template
    >
  </ul>
  <p
    class="swb-empty"
    data-simply-field="empty"
    data-simply-transform="escape_html"
  ></p>
</div>
