<div style="display: contents">
  <div
    class="swb-toolbar swb-app-toolbar"
    data-simply-field="editing"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    <form data-simply-command="mkdir">
      <label
        >New folder name<input
          class="swb-control swb-labeled-control"
          name="name"
          required /></label
      ><button class="ds-button swb-toolbar-button">Create folder</button>
    </form>
    <label
      class="ds-button swb-file-upload swb-toolbar-label swb-toolbar-button"
      >Upload files<input
        class="swb-control swb-labeled-control swb-file-upload-input"
        type="file"
        multiple
        aria-label="Upload files"
        data-simply-command="upload"
    /></label>
  </div>
</div>
