<section class="swb-files-sharing" aria-label="Sharing preparation" hidden
  data-simply-field="swb_shareVisible" data-simply-transform="attributes"
  data-simply-attributes="hidden">
  <h2>Selected recipient</h2>
  <dl>
    <dt>Resource</dt><dd data-simply-field="swb_shareResource" data-simply-transform="escape_html"></dd>
    <dt>Person</dt><dd data-simply-field="swb_sharePerson" data-simply-transform="escape_html"></dd>
    <dt>Contact identity</dt><dd data-simply-field="swb_shareId" data-simply-transform="escape_html"></dd>
    <dt>Address-book document</dt><dd data-simply-field="swb_shareDocument" data-simply-transform="escape_html"></dd>
    <dt>Email</dt><dd data-simply-field="swb_shareEmail" data-simply-transform="escape_html"></dd>
    <dt>Phone</dt><dd data-simply-field="swb_sharePhone" data-simply-transform="escape_html"></dd>
    <dt>WebID / public profile</dt><dd data-simply-field="swb_shareWebId" data-simply-transform="escape_html"></dd>
  </dl>
  <p role="status" data-simply-field="swb_shareStatus" data-simply-transform="escape_html"></p>
  <button type="button" class="ds-button swb-share-button"
    data-simply-command="swb_changeShareRecipient">Choose someone else</button>
</section>
