<div
  class="muze-solid-design-toolbar muze-solid-design-toolbar-floating muze-solid-notebook-block-tools"
  role="group"
  data-simply-field="muzeSolidNotebookBlockToolbar"
  data-simply-transform="attributes"
  data-simply-attributes="style aria-label aria-hidden inert data-muze-solid-notebook-tool-block"
>
  <div style="display: contents" data-simply-list="muzeSolidNotebookBlockTools">
    <template>
      <button
        type="button"
        class="muze-solid-design-tool muze-solid-design-tool-stacked"
        data-simply-command="muzeSolidNotebookBlockCommand"
        data-simply-value=":value.id"
        data-simply-field="attributes"
        data-simply-transform="attributes"
        data-simply-attributes="disabled title aria-label aria-pressed data-muze-solid-action"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use
            data-simply-field="icon"
            data-simply-transform="attributes"
            data-simply-attributes="href"
          ></use>
        </svg>
        <span
          data-simply-field="label"
          data-simply-transform="escape_html"
        ></span>
      </button>
    </template>
  </div>
</div>
