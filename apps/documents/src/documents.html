            class="solid-control"
        /></label>
        <button class="solid-tool">Open PDF</button>
        <label class="solid-label solid-field"
          >Or local PDF
          <input
            class="solid-control"
            type="file"
            accept="application/pdf"
            data-document-file
        /></label>
        <button
          class="solid-tool"
          type="button"
          data-simply-command="muzeDocumentsCancel"
        >
          Cancel loading
        </button>
      </form>
    </div>
  </dialog>

  <dialog
    class="ds-dialog solid-dialog"
    data-simply-behavior="solidDialog"
    data-document-dialog="groups"
    aria-label="Annotation groups"
  >
    <div class="solid-dialog-header">
      <h2 class="swb-dialog-title">Annotation groups</h2>
      <button
        type="button"
        class="ds-button solid-marker-button solid-dialog-close"
        data-simply-command="solidCloseDialog"
        aria-label="Close"
        title="Close"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#x"></use>
        </svg>
      </button>
    </div>
    <div class="solid-dialog-content solid-fields">
      <label class="solid-label solid-field"
        >Writing group
        <span class="solid-select-wrap"
          ><select
            class="solid-control solid-select"
            data-document-group
            data-simply-list="muzeDocumentsGroups"
          >
            <template
              ><option
                data-simply-field="attributes"
                data-simply-transform="attributes"
                data-simply-attributes="value selected label"
              ></option
            ></template></select
          ><span
            class="solid-chevron"
            aria-hidden="true"
          ></span></span
      ></label>
      <p
        data-simply-field="muzeDocumentsGroupStatus"
        data-simply-transform="escape_html"
      ></p>

      <form
        class="solid-fields"
        data-simply-command="muzeDocumentsNewGroup"
      >
        <label class="solid-label solid-field"
          >New group name
          <input
            class="solid-control"
            name="name"
            required /></label
        ><button class="solid-tool">Create group</button>
      </form>
      <button
        class="solid-tool"
        data-simply-command="muzeDocumentsExport"
      >
        Export group Turtle
      </button>
      <label class="solid-label solid-field"
        >Import group
        <input
          class="solid-control"
          type="file"
          accept=".ttl,text/turtle"
          data-group-file
      /></label>
      <form
        class="solid-fields"
        data-simply-command="muzeDocumentsOpenGroup"
      >
        <label class="solid-label solid-field"
          >Annotation file URL
          <input
            class="solid-control"
            type="url"
            name="url"
            required /></label
        ><button class="solid-tool">Add annotation file</button>
      </form>
      <button
        class="solid-tool"
        data-simply-command="muzeDocumentsSave"
      >
        Save group to Pod
      </button>
      <form
        class="solid-fields"
        data-simply-command="muzeDocumentsPublish"
      >
        <label class="solid-label solid-field"
          >Separate annotations folder
          <input
            class="solid-control"
            type="url"
            name="folder"
            required
            placeholder="https://my-pod.example/annotations/"
          />
        </label>
        <p>
          This folder's existing permissions apply. Choose a private folder for
          personal notes.
        </p>
        <button class="solid-tool">
          Create group resource in folder
        </button>
      </form>
      <ul
        data-simply-list="muzeDocumentsExternalSources"
        class="muze-documents-note-list"
      >
        <template
          ><li>
            <span
              data-simply-field="name"
              data-simply-transform="escape_html"
            ></span>
            <button
              type="button"
              class="solid-tool"
              data-simply-command="muzeDocumentsEnableWriting"
              data-simply-value=":value.id"
              data-simply-field="label"
              data-simply-transform="escape_html"
            ></button></li
        ></template>
      </ul>
    </div>
  </dialog>
  <dialog
    class="ds-dialog solid-dialog"
    data-document-dialog="destination"
    data-simply-behavior="solidDialog"
    aria-labelledby="muze-documents-destination-title"
  >
    <form
      class="swb-dialog-form"
      data-simply-command="muzeDocumentsChooseDestination"
    >
      <header class="solid-dialog-header">
        <h2 class="swb-dialog-title" id="muze-documents-destination-title">
          New annotation
        </h2>
        <button
          type="button"
          class="ds-button solid-marker-button solid-dialog-close"
          data-simply-command="solidCloseDialog"
          aria-label="Close"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use href="../assets/feather-icons.svg#x"></use>
          </svg>
        </button>
      </header>
      <div class="solid-dialog-content">
        <label class="solid-label solid-field"
          >Save annotation in
          <span class="solid-select-wrap"
            ><select
              name="destination"
              class="solid-control solid-select"
              data-simply-list="muzeDocumentsDestinations"
            >
              <template
                ><option
                  data-simply-field="attributes"
                  data-simply-transform="attributes"
                  data-simply-attributes="value selected label"
                ></option
              ></template></select
            ><span class="solid-chevron" aria-hidden="true"></span
          ></span>
        </label>
      </div>
      <footer class="solid-dialog-footer">
        <button class="solid-tool">Continue to editor</button>
      </footer>
    </form>
  </dialog>
  <dialog
    class="ds-dialog solid-dialog"
    data-document-dialog="annotation"
    data-simply-behavior="muzeDocumentsAnnotationDialog"
    aria-labelledby="muze-documents-annotation-title"
  >
    <header class="solid-dialog-header">
      <h2 class="swb-dialog-title" id="muze-documents-annotation-title">
        Annotation
      </h2>
      <button
        type="button"
        class="ds-button solid-marker-button solid-dialog-close"
        data-simply-command="muzeDocumentsCloseNote"
        aria-label="Close annotation"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#x"></use>
        </svg>
      </button>
    </header>
    <div class="solid-dialog-content">
      <p
        class="solid-status"
        role="status"
        data-simply-field="muzeDocumentsEditorStatus"
        data-simply-transform="escape_html"
      ></p>
      <label
        class="solid-label solid-field"
        data-simply-field="muzeDocumentsDestinationField"
        data-simply-transform="attributes"
        data-simply-attributes="hidden"
        >Save annotation in
        <span class="solid-select-wrap"
          ><select
            class="solid-control solid-select"
            data-note-destination
            data-simply-list="muzeDocumentsDestinations"
          >
            <template
              ><option
                data-simply-field="attributes"
                data-simply-transform="attributes"
                data-simply-attributes="value selected label"
              ></option
            ></template>
          </select>
          <span class="solid-chevron" aria-hidden="true"></span
        ></span>
      </label>
      <div
        class="muze-documents-editor"
        data-note-editor
        aria-label="Annotation body"
      ></div>
    </div>
    <div
      class="solid-toolbar solid-toolbar-floating"
      data-note-formatting
      hidden
      data-simply-field="muzeDocumentsFormatting"
      data-simply-transform="attributes"
      data-simply-attributes="hidden style"
      role="group"
      aria-label="Annotation formatting"
    >
      <button
        type="button"
        class="solid-tool"
        data-simply-command="muzeDocumentsFormat"
        data-simply-value="strong"
        data-simply-field="muzeDocumentsBold"
        data-simply-transform="attributes"
        data-simply-attributes="aria-pressed"
        aria-label="Bold"
        title="Bold"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#bold"></use>
        </svg>
      </button>
      <button
        type="button"
        class="solid-tool"
        data-simply-command="muzeDocumentsFormat"
        data-simply-value="em"
        data-simply-field="muzeDocumentsItalic"
        data-simply-transform="attributes"
        data-simply-attributes="aria-pressed"
        aria-label="Italic"
        title="Italic"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#italic"></use>
        </svg>
      </button>
      <button
        type="button"
        class="solid-tool"
        data-simply-command="muzeDocumentsLink"
        aria-label="Link"
        title="Link"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#link"></use>
        </svg>
      </button>
    </div>
    <footer class="solid-dialog-footer">
      <button
        type="button"
        class="solid-tool"
        data-simply-command="muzeDocumentsSaveNote"
        title="Save (Ctrl+Enter / Cmd+Enter)"
        aria-keyshortcuts="Control+Enter Meta+Enter"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#check"></use></svg
        >Save
      </button>
    </footer>
  </dialog>
  <dialog
    class="ds-dialog solid-dialog"
    data-document-dialog="annotation-link"
    data-simply-behavior="solidDialog"
    aria-labelledby="muze-documents-link-title"
  >
    <form class="swb-dialog-form" data-simply-command="muzeDocumentsApplyLink">
      <header class="solid-dialog-header">
        <h2 class="swb-dialog-title" id="muze-documents-link-title">
          Hyperlink
        </h2>
        <button
          type="button"
          class="ds-button solid-marker-button solid-dialog-close"
          data-simply-command="solidCloseDialog"
          aria-label="Close hyperlink"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use href="../assets/feather-icons.svg#x"></use>
          </svg>
        </button>
      </header>
      <div class="solid-dialog-content">
        <label class="solid-label solid-field"
          >Address
          <input
            class="solid-control"
            type="url"
            name="href"
            required
            autofocus
          />
        </label>
        <p
          class="solid-status"
          role="status"
          data-simply-field="muzeDocumentsLinkStatus"
          data-simply-transform="escape_html"
        ></p>
      </div>
      <footer class="solid-dialog-footer">
        <button class="solid-tool">Add link</button>
      </footer>
    </form>
  </dialog>
</div>
