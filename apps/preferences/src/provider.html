<section
  hidden
  data-simply-field="swb_panels.providers"
  data-simply-transform="attributes"
  data-simply-attributes="hidden"
>
  <p>
    Choose the app for each task. This choice applies across your workspaces
    under the selected WebID.
  </p>
  <label class="solid-label"
    >Task
    <span class="solid-select-wrap"
      ><select
        class="solid-select solid-control swb-control swb-labeled-control"
        data-simply-field="swb_providerKind"
        data-simply-command="swb_chooseProviderKind"
      >
        <option value="shortcutMetadataProvider">Shortcut metadata</option>
        <option value="browseProvider">Files and folders</option>
        <option value="recipientProvider">Recipients</option>
        <option value="viewProvider">Resource views</option>
        <option value="textViewProvider">Text views</option>
        <option value="textCreateProvider">Create text</option>
        <option value="noteBodyProvider">Edit annotation body</option><option value="pdfViewProvider">View PDF</option><option value="textEditProvider">Edit text</option></select
      ><span class="solid-chevron" aria-hidden="true"></span
    ></span>
  </label>
  <p>
    Current provider
    <strong
      class="swb-provider-current"
      data-simply-field="swb_providerCurrent"
      data-simply-transform="escape_html"
    ></strong>
  </p>
  <label class="solid-label"
    ><span data-simply-field="swb_providerLabel"
      data-simply-transform="escape_html">Application</span>
    <span class="solid-select-wrap"
      ><select
        class="solid-select solid-control swb-control swb-labeled-control"
        data-simply-field="swb_providerSelect"
        data-simply-command="swb_chooseProvider"
        aria-describedby="swb-provider-help swb-preferences-status"
      ></select
      ><span class="solid-chevron" aria-hidden="true"></span
    ></span>
  </label>
  <div
    hidden
    data-simply-field="swb_providerCustom"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    <label class="solid-label"
      >Custom provider URL
      <input
        type="url"
        name="swb_providerUrl"
        class="solid-control swb-control swb-labeled-control"
        data-simply-field="swb_providerUrl"
        data-simply-command="swb_customProvider"
        aria-describedby="swb-provider-help swb-preferences-status"
      />
    </label>
  </div>
  <p id="swb-provider-help" data-simply-field="swb_providerHelp"
    data-simply-transform="escape_html"></p>
  <p
    role="status"
    data-simply-field="swb_providerDiscovery"
    data-simply-transform="escape_html"
  ></p>
  <button
    type="button"
    class="solid-tool"
    data-simply-field="swb_providerRefresh"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
    data-simply-command="swb_refreshProviders"
  >
    Refresh available apps
  </button>
  <button
    type="button"
    class="solid-tool"
    data-simply-command="swb_resetProvider"
  >
    Use default provider
  </button>
</section>
