<div
  class="muze-solid-viewer-surface"
  data-simply-field="muzeSolidViewerAppearance"
  data-simply-transform="attributes"
  data-simply-attributes="style data-muze-solid-viewer-bounded data-muze-solid-viewer-fit"
>
  <form
    class="ds-form muze-solid-viewer-open"
    data-simply-command="muzeSolidViewerOpen"
    data-simply-field="muzeSolidViewerStandalone"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    <label
      >Resource URL
      <input
        type="url"
        name="resource"
        required
        data-simply-field="muzeSolidViewerResource"
        data-simply-transform="escape_html"
    /></label>
    <button class="ds-button" type="submit">View resource</button>
    <button
      class="ds-button"
      type="button"
      data-simply-command="muzeSolidTextNew"
    >
      Write text
    </button>
  </form>
  <p
    class="muze-solid-viewer-status"
    role="status"
    data-simply-field="muzeSolidViewerStatus"
    data-simply-transform="escape_html"
  ></p>
  <pre
    class="muze-solid-viewer-text"
    data-simply-field="muzeSolidViewerText"
    data-simply-transform="escape_html"
  ></pre>
  <img
    class="muze-solid-viewer-image"
    data-simply-field="muzeSolidViewerImage"
    data-simply-transform="attributes"
    data-simply-attributes="src alt hidden"
    hidden
  />
</div>
