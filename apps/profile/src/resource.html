<div style="display: contents">
  <section
    class="swb-profile-controls swb-app-toolbar"
    aria-label="Profile actions"
  >
    <form class="swb-toolbar swb-profile-toolbar" data-simply-command="load">
      <label class="swb-toolbar-label"
        >Profile URL<input
          class="swb-control swb-labeled-control"
          name="url"
          type="url"
          required
          data-simply-field="url"
          placeholder="https://example.org/profile/card#me" /></label
      ><button class="ds-button ds-button-primary swb-toolbar-button">
        View profile
      </button>
      <button
        type="button"
        class="ds-button swb-toolbar-button"
        data-simply-command="mine"
      >
        My Solid profile
      </button>
    </form>
  </section>
</div>
