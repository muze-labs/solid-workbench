<fieldset
  class="muze-solid-presenter-controls"
  data-simply-field="muzeSolidPresenterBusy"
  data-simply-transform="attributes"
  data-simply-attributes="disabled"
>
  <legend class="swb-visually-hidden">Deck editor</legend>
  <div
    class="muze-solid-presenter-workspace"
    data-simply-field="muzeSolidPresenterMode"
    data-simply-transform="attributes"
    data-simply-attributes="data-muze-solid-presenting"
  >
    <div
      class="muze-solid-presenter-slide-tools muze-solid-presenter-editing solid-toolbar"
      aria-label="Deck and slide actions"
    >
      <span
        class="solid-toolbar-title muze-solid-presenter-title"
        data-simply-field="muzeSolidPresenterTitle"
        data-simply-transform="escape_html"
      ></span>
      <button
        class="solid-tool"
        data-simply-command="muzeSolidPresenterEditTitle"
        aria-label="Edit deck title"
        title="Edit deck title"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#edit-2"></use>
        </svg>
      </button>
      <div class="solid-popup-scope muze-solid-presenter-deck-menu"
        style="--solid-popup-anchor: --muze-solid-presenter-deck-menu">
        <button
          type="button"
          class="solid-tool solid-popup-trigger"
          popovertarget="muze-solid-presenter-deck-sheet"
        >
          Deck
        </button>
        <div
          class="solid-popup solid-popup-anchored muze-solid-presenter-deck-sheet"
          id="muze-solid-presenter-deck-sheet"
          popover="auto"
          role="group"
          aria-label="Deck settings"
        >
          <label class="solid-label"
            >Deck document URL<input
              class="solid-control"
              type="url"
              data-simply-field="muzeSolidPresenterUrl"
              data-simply-transform="escape_html"
          /></label>
          <div class="solid-toolbar">
            <button
              class="solid-tool"
              data-simply-command="muzeSolidPresenterSave"
            >
              Save to Pod
            </button>
            <button
              class="solid-tool"
              data-simply-command="muzeSolidPresenterOpen"
            >
              Open from Pod
            </button>
          </div>
          <div class="solid-toolbar">
            <button
              class="solid-tool"
              data-simply-command="muzeSolidPresenterNew"
            >
              New deck
            </button>
            <button
              class="solid-tool"
              data-simply-command="muzeSolidPresenterImportLocal"
            >
              Copy signed-out deck
            </button>
          </div>
        </div>
      </div>
      <div
        class="muze-solid-presenter-slide-actions"
        data-simply-field="muzeSolidPresenterSelection"
        data-simply-transform="attributes"
        data-simply-attributes="hidden"
      >
        <button
          class="solid-tool"
          data-simply-command="muzeSolidPresenterBackground"
          data-simply-field="muzeSolidPresenterBackgroundVisibility"
          data-simply-transform="attributes"
          data-simply-attributes="hidden"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use href="../assets/feather-icons.svg#image"></use></svg
          >Background
        </button>
        <button
          class="solid-tool"
          data-simply-command="muzeSolidPresenterMove"
          data-simply-value="-1"
          aria-label="Move slide earlier"
          title="Move slide earlier"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use href="../assets/feather-icons.svg#arrow-left"></use>
          </svg>
          Move earlier
        </button>
        <button
          class="solid-tool"
          data-simply-command="muzeSolidPresenterMove"
          data-simply-value="1"
          aria-label="Move slide later"
          title="Move slide later"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use href="../assets/feather-icons.svg#arrow-right"></use>
          </svg>
          Move later
        </button>
        <button
          class="solid-tool"
          data-simply-command="muzeSolidPresenterRemove"
          aria-label="Remove slide"
          title="Remove slide"
        >
          <svg class="ds-icon ds-icon-feather" aria-hidden="true">
            <use href="../assets/feather-icons.svg#trash-2"></use>
          </svg>
        </button>
        <div
          class="solid-popup-scope muze-solid-presenter-view-options"
        style="--solid-popup-anchor: --muze-solid-presenter-view-options"
        >
          <button
            type="button"
            class="solid-tool solid-popup-trigger"
            popovertarget="muze-solid-presenter-view-sheet"
          >
            View options
          </button>
          <div
            class="solid-popup solid-popup-anchored muze-solid-presenter-deck-sheet"
            id="muze-solid-presenter-view-sheet"
            popover="auto"
            role="group"
            aria-label="Slide view options"
            data-simply-list="muzeSolidPresenterRegions"
          >
            <template
              ><div>
                <span
                  data-simply-field="label"
                  data-simply-transform="escape_html"
                ></span>
                <button
                  class="solid-tool"
                  data-simply-command="muzeSolidPresenterRetryRegion"
                  data-simply-value=":value.id"
                >
                  Retry
                </button>
                <button
                  class="solid-tool"
                  data-simply-command="muzeSolidPresenterUseProvider"
                  data-simply-value=":value.id"
                >
                  Use preferred provider
                </button>
                <button
                  class="solid-tool"
                  data-simply-command="muzeSolidPresenterDiscardRegion"
                  data-simply-value=":value.id"
                  hidden
                  data-simply-field="discard"
                  data-simply-transform="attributes"
                  data-simply-attributes="hidden"
                >
                  Discard view and its draft
                </button>
              </div></template
            >
          </div>
        </div>
      </div>
    </div>
    <div class="muze-solid-presenter-panels">
      <nav
        class="muze-solid-presenter-filmstrip muze-solid-presenter-editing"
        aria-label="Slides"
      >
        <ol
          class="muze-solid-presenter-list"
          data-simply-list="muzeSolidPresenterSlides"
          data-simply-list-key="id"
        >
          <template
            ><li>
              <button
                class="muze-solid-presenter-slide-button solid-list-state"
                data-simply-command="muzeSolidPresenterSelect"
                data-simply-value=":value.id"
                data-simply-field="attributes"
                data-simply-transform="attributes"
                data-simply-attributes="aria-current aria-label title data-muze-solid-slide"
              >
                <span class="muze-solid-presenter-thumbnail" aria-hidden="true">
                  <img
                    class="muze-solid-presenter-thumbnail-image"
                    alt=""
                    data-simply-field="image"
                    data-simply-transform="attributes"
                    data-simply-attributes="src hidden"
                  />
                  <span
                    class="muze-solid-presenter-thumbnail-text"
                    data-simply-field="fragment"
                    data-simply-transform="muzeSolidPresenterRichText"
                  ></span>
                </span>
                <span
                  class="muze-solid-presenter-thumbnail-number"
                  data-simply-field="number"
                  data-simply-transform="escape_html"
                ></span>
              </button></li
          ></template>
        </ol>
      </nav>
      <section
        class="muze-solid-presenter-current"
        aria-label="Current slide"
        data-simply-field="muzeSolidPresenterSelection"
        data-simply-transform="attributes"
        data-simply-attributes="hidden"
      >
        <div class="muze-solid-presenter-stage">
          {{view:muze-solid-presenter-regions:./regions.html}}
        </div>
        <nav
          class="muze-solid-presenter-navigation solid-toolbar"
          aria-label="Presentation controls"
        >
          <button
            class="solid-tool"
            data-simply-command="muzeSolidPresenterStep"
            data-simply-value="-1"
            aria-label="Previous slide"
          >
            <svg class="ds-icon ds-icon-feather" aria-hidden="true">
              <use href="../assets/feather-icons.svg#chevron-left"></use>
            </svg>
          </button>
          <span
            role="status"
            data-simply-field="muzeSolidPresenterPosition"
            data-simply-transform="escape_html"
          ></span>
          <button
            class="solid-tool"
            data-simply-command="muzeSolidPresenterStep"
            data-simply-value="1"
            aria-label="Next slide"
          >
            <svg class="ds-icon ds-icon-feather" aria-hidden="true">
              <use href="../assets/feather-icons.svg#chevron-right"></use>
            </svg>
          </button>
          <button
            class="solid-tool"
            data-simply-command="muzeSolidPresenterExit"
          >
            Exit presentation
          </button>
        </nav>
      </section>
      <div
        class="muze-solid-presenter-empty"
        data-simply-field="muzeSolidPresenterEmpty"
        data-simply-transform="attributes"
        data-simply-attributes="hidden"
      >
        <p>Start with a slide.</p>
        <button
          class="solid-tool"
          data-simply-command="muzeSolidPresenterAdd"
          data-simply-value="image"
        >
          Add slide
        </button>
      </div>
    </div>
    <p
      role="status"
      class="muze-solid-presenter-status muze-solid-presenter-editing"
      data-simply-field="muzeSolidPresenterStatus"
      data-simply-transform="escape_html"
    ></p>
  </div>
</fieldset>

<dialog
  class="ds-dialog solid-dialog muze-solid-presenter-title-dialog"
  data-simply-behavior="solidDialog"
  aria-labelledby="muze-solid-presenter-title-heading"
>
  <form
    class="swb-dialog-form"
    data-simply-command="muzeSolidPresenterSaveTitle"
  >
    <header class="solid-dialog-header">
      <h2 id="muze-solid-presenter-title-heading" class="swb-dialog-title">
        Deck title
      </h2>
      <button
        type="button"
        class="ds-button solid-marker-button solid-dialog-close"
        data-simply-command="solidCloseDialog"
        aria-label="Close deck title"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#x"></use>
        </svg>
      </button>
    </header>
    <div class="solid-dialog-content">
      <label class="solid-label"
        >Title<input
          class="solid-control"
          name="deck-title"
          data-simply-field="muzeSolidPresenterTitleDraft"
          autofocus
      /></label>
      <p
        role="status"
        data-simply-field="muzeSolidPresenterStatus"
        data-simply-transform="escape_html"
      ></p>
    </div>
    <footer class="solid-dialog-footer">
      <button
        type="submit"
        class="ds-button solid-button solid-button-primary"
      >
        Apply
      </button>
      <button
        type="button"
        class="ds-button solid-button"
        data-simply-command="solidCloseDialog"
      >
        Cancel
      </button>
    </footer>
  </form>
</dialog>
