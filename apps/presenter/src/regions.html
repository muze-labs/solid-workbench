<div
  class="muze-solid-presenter-canvas"
  data-simply-list="muzeSolidPresenterRegions"
>
  <template
    ><section
      class="muze-solid-presenter-region"
      data-simply-field="attributes"
      data-simply-transform="attributes"
      data-simply-attributes="data-region data-kind aria-label"
    >
      <iframe
        class="muze-solid-presenter-frame"
        tabindex="-1"
        referrerpolicy="no-referrer"
        data-simply-field="frame"
        data-simply-transform="attributes"
        data-simply-attributes="src hidden title data-region-id aria-busy aria-hidden inert data-muze-solid-ui-loading tabindex style"
      ></iframe>
      <p
        role="status"
        data-simply-field="status"
        data-simply-transform="escape_html"
        class="muze-solid-presenter-region-status"
      ></p></section
  ></template>
</div>
