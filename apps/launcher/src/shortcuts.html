<div style="display: contents">
  <section class="swb-saved-apps">
    <h2 class="swb-visually-hidden">Your shortcuts</h2>
    <div class="swb-launcher-grid">
      <ul
        class="swb-person-list swb-shortcut-list"
        data-simply-list="shortcuts"
      >
        <template
          ><li class="swb-shortcut swb-list-item">
            <a
              class="swb-shortcut-link"
              data-simply-command="launchApp"
              data-simply-field="link"
              data-simply-transform="attributes"
              data-simply-attributes="href target rel"
              ><svg
                class="ds-icon ds-icon-feather swb-app-icon"
                aria-hidden="true"
                data-simply-field="spriteVisibility"
                data-simply-transform="attributes"
                data-simply-attributes="hidden"
              >
                <use
                  data-simply-field="spriteIcon"
                  data-simply-transform="attributes"
                  data-simply-attributes="href"
                ></use></svg
              ><img
                class="swb-shortcut-image"
                alt=""
                width="64"
                height="64"
                data-simply-field="icon"
                data-simply-transform="attributes"
                data-simply-attributes="src hidden" /><span
                data-simply-field="label"
                data-simply-transform="escape_html"
              ></span
            ></a>
            <button
              type="button"
              class="ds-button swb-shortcut-settings swb-list-action"
              data-simply-command="swb_shortcutSettings"
            >
              Shortcut settings
            </button>
            <dialog
              class="ds-dialog muze-solid-design-dialog muze-solid-launcher-shortcut-settings"
              data-simply-behavior="muzeSolidDesignDialog"
              aria-label="Shortcut settings"
            >
              <header class="muze-solid-design-dialog-header">
                <h2 class="swb-dialog-title">Shortcut settings</h2>
                <button
                  type="button"
                  class="ds-button muze-solid-design-dialog-close"
                  aria-label="Close shortcut settings"
                  data-simply-command="muzeSolidDesignCloseDialog"
                >
                  <svg class="ds-icon ds-icon-feather" aria-hidden="true">
                    <use href="../assets/feather-icons.svg#x"></use>
                  </svg>
                </button>
              </header>
              <div class="muze-solid-design-dialog-content">
                <label
                  >Name<input
                    class="swb-control swb-labeled-control"
                    name="swb_shortcutName"
                    data-simply-field="label"
                /></label>
                <label
                  >Icon URL override<input
                    class="swb-control swb-labeled-control"
                    name="swb_shortcutIcon"
                    type="url"
                    data-simply-field="iconUrl"
                /></label>
                <p>Leave blank to use the application's icon.</p>
                <button
                  type="button"
                  class="ds-button"
                  data-simply-command="swb_editShortcut"
                  data-simply-value=":value.id"
                >
                  Save name and icon
                </button>
                <label
                  >Launch mode<select
                    class="swb-control swb-labeled-control"
                    data-simply-field="mode"
                    data-simply-command="setLaunchMode"
                    data-simply-value=":value.id"
                  >
                    <option value="">Follow application</option>
                    <option value="fragment">URL fragment (#)</option>
                    <option value="query">URL query (?)</option>
                  </select></label
                ><label
                  ><input
                    class="swb-control swb-labeled-control"
                    type="checkbox"
                    data-simply-field="anonymous"
                    data-simply-command="setAnonymous"
                    data-simply-value=":value.id"
                  />
                  Launch anonymously (omit WebID)</label
                ><button
                  class="ds-button"
                  data-simply-command="remove"
                  data-simply-value=":value.id"
                >
                  Remove shortcut
                </button>
                <p
                  class="swb-muted"
                  data-simply-field="modeNote"
                  data-simply-transform="escape_html"
                ></p>
              </div>
            </dialog>
            <p
              class="swb-muted"
              role="status"
              data-simply-field="problem"
              data-simply-transform="escape_html"
            ></p></li
        ></template>
      </ul>
      <button
        type="button"
        class="ds-button swb-add-shortcut"
        data-simply-command="muzeSolidCatalogOpen"
      >
        <svg class="ds-icon ds-icon-feather swb-app-icon" aria-hidden="true">
          <use href="../assets/feather-icons.svg#plus"></use>
        </svg>
        <span>Add apps</span>
      </button>
    </div>
    <p
      class="swb-empty swb-home-empty"
      data-simply-field="empty"
      data-simply-transform="escape_html"
    ></p>
  </section>
</div>
