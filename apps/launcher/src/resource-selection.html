<div style="display: contents">
  <details class="swb-launch-profile">
    <summary>Open a profile resource</summary>
    <form
      class="swb-toolbar swb-app-toolbar"
      data-simply-command="launchProfile"
    >
      <label class="swb-toolbar-label"
        >Profile resource URL (optional)<input
          class="swb-control swb-labeled-control"
          name="resource"
          type="url"
          placeholder="https://example.org/contacts.ttl#alice"
          data-simply-field="resource"
          data-simply-command="workspaceChanged"
          data-simply-immediate="true" /></label
      ><label class="swb-toolbar-label"
        ><input
          class="swb-control swb-labeled-control"
          type="checkbox"
          name="anonymous"
        />
        Launch anonymously (omit WebID)</label
      ><button class="ds-button ds-button-primary swb-toolbar-button">
        Open in Profile
      </button>
      <button
        type="button"
        class="ds-button swb-toolbar-button"
        data-simply-command="pickResource"
        data-simply-field="pickState"
        data-simply-transform="attributes"
        data-simply-attributes="aria-disabled"
      >
        Choose in Files
      </button>
      <button
        type="button"
        class="ds-button swb-toolbar-button"
        data-simply-command="cancelPick"
        data-simply-field="cancelState"
        data-simply-transform="attributes"
        data-simply-attributes="hidden"
        hidden
      >
        Cancel selection
      </button>
    </form>
    <p
      role="status"
      data-simply-field="pickerMessage"
      data-simply-transform="escape_html"
    ></p>
    <p class="swb-muted">
      Uses your connected WebID unless anonymous is selected.
    </p>
  </details>
</div>
