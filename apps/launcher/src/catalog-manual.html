<form class="muze-solid-catalog-manual-form" data-simply-command="add">
  <label
    >Name<input class="swb-control swb-labeled-control" name="name"
  /></label>
  <label
    >Application URL<input
      class="swb-control swb-labeled-control"
      name="url"
      type="url"
  /></label>
  <label
    >Application manifest URL (optional)<input
      class="swb-control swb-labeled-control"
      name="manifest"
      type="url"
  /></label>
  <label
    >Icon URL (optional)<input
      class="swb-control swb-labeled-control"
      name="icon"
      type="url"
  /></label>
  <p>
    Enter an application URL, or use its RDF manifest. You can change the name
    and icon.
  </p>
  <details>
    <summary>Launch options</summary>
    <label
      >Launch mode<select
        class="swb-control swb-labeled-control"
        name="launchMode"
      >
        <option value="">Follow application</option>
        <option value="fragment">URL fragment (#)</option>
        <option value="query">URL query (?)</option>
      </select></label
    >
    <label
      ><input
        class="swb-control swb-labeled-control"
        type="checkbox"
        name="anonymous"
      />
      Launch anonymously (omit WebID)</label
    >
    <p class="swb-muted">
      Anonymous applies to this shortcut. It does not sign you out of the
      receiving app.
    </p>
  </details>

  <button class="ds-button ds-button-primary">Add shortcut</button>
</form>
