<form class="muze-solid-catalog-manual-form" data-simply-command="add">
  <label class="solid-label"
    >Name<input
      class="solid-control swb-control swb-labeled-control"
      name="name"
  /></label>
  <label class="solid-label"
    >Application URL<input
      class="solid-control swb-control swb-labeled-control"
      name="url"
      type="url"
  /></label>
  <label class="solid-label"
    >Application manifest URL (optional)<input
      class="solid-control swb-control swb-labeled-control"
      name="manifest"
      type="url"
  /></label>
  <label class="solid-label"
    >Icon URL (optional)<input
      class="solid-control swb-control swb-labeled-control"
      name="icon"
      type="url"
  /></label>
  <p>
    Enter an application URL, or use its RDF manifest. You can change the name
    and icon. For a compatible Workbench app on another origin, choose a
    launch mode under Launch options.
  </p>
  <label class="solid-label">
    <input type="checkbox" name="localOnly" class="solid-choice-input" />
    Add without looking up the title or icon
  </label>
  <details>
    <summary>Launch options</summary>
    <label class="solid-label"
      >Launch mode<span class="solid-select-wrap"
        ><select
          class="solid-select solid-control swb-control swb-labeled-control"
          name="launchMode"
        >
          <option value="">Follow application</option>
          <option value="fragment">URL fragment (#)</option>
          <option value="query">URL query (?)</option></select
        ><span
          class="solid-chevron"
          aria-hidden="true"
        ></span></span
    ></label>
    <label class="solid-label"
      ><input
        class="solid-choice-input"
        type="checkbox"
        name="anonymous"
      />
      Launch anonymously (omit WebID)</label
    >
    <p class="swb-muted">
      Anonymous applies to this shortcut. It does not sign you out of the
      receiving app.
    </p>
  </details>

  <button
    class="solid-button ds-button ds-button-primary solid-button-primary"
  >
    Add shortcut
  </button>
</form>
