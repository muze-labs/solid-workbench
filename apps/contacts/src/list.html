<div style="display: contents">
  <section
    class="swb-contacts-list ds-panels-pane ds-panels-list swb-list-pane"
    aria-label="Contacts"
  >
    <div class="swb-contacts-scroll">
      <ul class="swb-person-list swb-contacts-people" data-simply-list="people">
        <template
          ><li class="swb-list-item">
            <button
              class="swb-contact-select swb-list-action solid-list-row solid-list-state"
              data-simply-field="selection"
              data-simply-transform="attributes"
              data-simply-attributes="aria-current"
              data-simply-command="select"
              data-simply-value=":value.id"
            >
              <span class="swb-person-avatar" aria-hidden="true"
                ><svg class="ds-icon ds-icon-feather">
                  <use
                    href="../assets/feather-icons.svg#user"
                  ></use></svg></span
              ><span
                data-simply-field="label"
                data-simply-transform="escape_html"
              ></span>
            </button></li
        ></template>
      </ul>
      <p
        class="swb-empty"
        data-simply-field="empty"
        data-simply-transform="escape_html"
      ></p>
      <details class="swb-device-recovery">
        <summary>Device data recovery</summary>
        <p>
          Import contacts saved by an earlier version on this device into this
          address book. The previous copy is retained.
        </p>
        <button
          class="solid-button ds-button"
          data-simply-command="swb_recoverContacts"
        >
          Import previous device contacts
        </button>
      </details>
    </div>
    <div
      class="swb-contacts-toolbar solid-toolbar"
      role="group"
      aria-label="Contact actions"
    >
      <label class="solid-list-search"
        ><span class="solid-list-search-label">Search contacts</span
        >{{include:../../../packages/solid-design/src/search-icon.html}}<input
          class="solid-control swb-control solid-toolbar-input solid-list-search-input"
          type="search"
          placeholder="Search"
          data-simply-field="search"
          data-simply-command="search"
          data-simply-immediate="true"
      /></label>
      <button
        class="solid-tool"
        type="button"
        data-simply-command="newContact"
        aria-label="Add contact"
        title="Add contact"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#plus"></use>
        </svg>
      </button>
      <button
        class="solid-tool"
        type="button"
        data-simply-command="sync"
        aria-label="Sync with Solid"
        title="Sync with Solid"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#refresh-cw"></use>
        </svg>
      </button>
    </div>
    <dialog
      data-simply-behavior="solidDialog"
      class="ds-dialog new-contact-dialog solid-dialog"
    >
      <form class="swb-dialog-form" data-simply-command="add">
        <header class="solid-dialog-header">
          <h2 class="swb-dialog-title">New contact</h2>
          <button
            type="button"
            class="ds-button solid-marker-button solid-dialog-close"
            data-simply-command="cancelNew"
            aria-label="Close new contact dialog"
          >
            <svg class="ds-icon ds-icon-feather" aria-hidden="true">
              <use href="../assets/feather-icons.svg#x"></use>
            </svg>
          </button>
        </header>
        <div class="solid-dialog-content">
          <label class="solid-label"
            >Name<input
              class="solid-control swb-control swb-labeled-control"
              name="name"
              placeholder="Name (optional)"
          /></label>
        </div>
        <footer class="solid-dialog-footer">
          <button
            class="solid-button ds-button ds-button-primary solid-button-primary"
          >
            Add contact</button
          ><button
            class="solid-button ds-button"
            type="button"
            data-simply-command="cancelNew"
          >
            Cancel
          </button>
        </footer>
      </form>
    </dialog>
  </section>
</div>
