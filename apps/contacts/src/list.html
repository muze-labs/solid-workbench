<div style="display: contents">
  <section
    class="contacts-list ds-panels-pane ds-panels-list"
    aria-label="Contacts"
  >
    <ul class="person-list" data-simply-list="people">
      <template
        ><li>
          <button data-simply-command="select" data-simply-value=":value.id">
            <span class="person-avatar" aria-hidden="true"
              ><svg class="ds-icon ds-icon-feather">
                <use href="../assets/feather-icons.svg#user"></use></svg></span
            ><span
              data-simply-field="label"
              data-simply-transform="escape_html"
            ></span>
          </button></li
      ></template>
    </ul>
    <p
      class="empty"
      data-simply-field="empty"
      data-simply-transform="escape_html"
    ></p>
    <div
      class="contacts-toolbar app-toolbar"
      role="toolbar"
      aria-label="Contact actions"
    >
      <label class="contact-search"
        ><span class="visually-hidden">Search contacts</span
        ><svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#search"></use></svg
        ><input
          type="search"
          aria-label="Search contacts"
          placeholder="Search"
          data-simply-field="search"
          data-simply-command="search"
          data-simply-immediate="true"
      /></label>
      <button
        class="ds-button ds-button-primary icon-button"
        type="button"
        data-simply-command="newContact"
        aria-label="Add contact"
        title="Add contact"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#plus"></use>
        </svg>
      </button>
      <button
        class="ds-button icon-button"
        type="button"
        data-simply-command="sync"
        aria-label="Sync with Solid"
        title="Sync with Solid"
      >
        <svg class="ds-icon ds-icon-feather" aria-hidden="true">
          <use href="../assets/feather-icons.svg#refresh-cw"></use>
        </svg>
      </button>
    </div>
    <details class="swb-device-recovery">
      <summary>Device data recovery</summary>
      <p>
        Import contacts saved by an earlier version on this device into this
        address book. The previous copy is retained.
      </p>
      <button class="ds-button" data-simply-command="swb_recoverContacts">
        Import previous device contacts
      </button>
    </details>
    <dialog
      data-simply-behavior="muzeSolidDesignDialog"
      class="ds-dialog new-contact-dialog muze-solid-design-dialog"
    >
      <form data-simply-command="add">
        <header class="muze-solid-design-dialog-header">
          <h2>New contact</h2>
          <button
            type="button"
            class="ds-button muze-solid-design-dialog-close"
            data-simply-command="cancelNew"
            aria-label="Close new contact dialog"
          >
            <svg class="ds-icon ds-icon-feather" aria-hidden="true">
              <use href="../assets/feather-icons.svg#x"></use>
            </svg>
          </button>
        </header>
        <div class="muze-solid-design-dialog-content">
          <label>Name<input name="name" placeholder="Name (optional)" /></label>
        </div>
        <footer class="muze-solid-design-dialog-footer">
          <button class="ds-button ds-button-primary">Add contact</button
          ><button
            class="ds-button"
            type="button"
            data-simply-command="cancelNew"
          >
            Cancel
          </button>
        </footer>
      </form>
    </dialog>
  </section>
</div>
