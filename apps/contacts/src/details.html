<div
  style="display: contents"
  data-simply-field="visibility"
  data-simply-transform="attributes"
  data-simply-attributes="hidden"
  hidden
>
  <div
    class="solid-toolbar"
    role="group"
    aria-label="Contact actions"
    data-simply-field="profile.detailsVisibility"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    <button class="solid-tool" data-simply-command="editProfile">
      <svg class="ds-icon ds-icon-feather" aria-hidden="true">
        <use href="../assets/feather-icons.svg#edit"></use>
      </svg>
      Edit profile
    </button>
    <button class="solid-tool" data-simply-command="remove">
      <svg class="ds-icon ds-icon-feather" aria-hidden="true">
        <use href="../assets/feather-icons.svg#trash-2"></use>
      </svg>
      Delete contact
    </button>
  </div>
</div>
